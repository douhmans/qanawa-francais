<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قَنَوة — قراءة الفرنسية (نموذج أولي)</title>
<meta name="theme-color" content="#1B4F8C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body data-view="home">
<header class="top">
  <div class="brand">
    <img src="assets/icon.svg" alt="" width="34" height="34">
    <span class="brand-name">قَنَوة</span>
    <span class="brand-sub">قراءة الفرنسية · السنة السادسة</span>
  </div>
  <div class="top-right">
    <button id="btn-offline" class="chip" title="حالة الاتصال">…</button>
    <span class="chip stars">★ <b id="xp-stars">0</b></span>
    <a class="chip" href="teacher.html">فضاء الأستاذ</a>
    <button id="btn-settings" class="chip" aria-label="الإعدادات">الإعدادات</button>
  </div>
</header>

<main id="main" aria-live="polite"></main>

<aside id="tutor" class="tutor" hidden>
  <div class="tutor-head">
    <button id="tutor-avatar" class="tutor-avatar" aria-label="نور">🌟</button>
    <div><b id="tutor-name">نور</b> <small>مرافقك · لا يعطي الحل بل يساعدك لتجده</small></div>
    <button id="tutor-close" class="icon-btn" aria-label="إغلاق">✕</button>
  </div>
  <ul id="tutor-log" class="tutor-log"></ul>
  <div id="tutor-quick" class="tutor-quick">
    <button data-q="explain">اشرح لي هذه الجملة</button>
    <button data-q="word">ماذا تعني هذه الكلمة؟</button>
    <button data-q="slow">نطّقها ببطء</button>
    <button data-q="test">اختبرني</button>
    <button data-q="scare">أنا متوتر</button>
  </div>
  <form id="tutor-form" class="tutor-form">
    <input id="tutor-input" placeholder="اكتب هنا…" autocomplete="off">
    <button type="submit">أرسل</button>
  </form>
</aside>

<div id="modal" class="modal" hidden><div class="modal-box" id="modal-box"></div></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
