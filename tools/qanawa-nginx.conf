# قَنَوة — serveur de la salle de classe (réseau local uniquement)
# Application 100 % statique : aucun PHP, aucune base de données, aucun accès Internet requis.
# But : une URL fixe pour toute la classe, et un HTTPS « suffisant » pour rendre le micro
# (SpeechRecognition) et le service worker disponibles hors localhost.
#
#   sudo cp tools/qanawa-nginx.conf /etc/nginx/sites-available/qanawa
#   sudo ln -s /etc/nginx/sites-available/qanawa /etc/nginx/sites-enabled/
#   sudo openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
#        -keyout /etc/ssl/private/qanawa.local.key -out /etc/ssl/certs/qanawa.local.crt \
#        -subj "/CN=qanawa.local"
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sur le poste élève, deux solutions selon le parc :
#  • le plus simple : les élèves gardent http://qanawa.local (le micro reste coupé, le champ
#    « nombre de mots » suffit) ; l'enseignant, lui, utilise https://qanawa.local (une fois le
#    certificat auto-signé accepté) pour la dictée et l'impression des bilans ;
#  • ou déployer l'AC sur les postes (stratégie de groupe) et tout le monde passe en https.

server {
    listen 80;
    listen [::]:80;
    server_name qanawa.local;

    root /srv/qanawa/prototype;
    index index.html;

    # RTL + français : charset explicite, sinon les accents et l'arabe sortent en ?
    charset utf-8;

    # Jamais de listing de répertoire, jamais de remontée de chemin.
    autoindex off;
    server_tokens off;

    # Fichiers servis : la liste est courte et figée → on refuse tout le reste.
    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Le manifeste et le service worker doivent être au sommet de l'arborescence (portée).
    # `webmanifest` est déjà connu des nginx ≥ 1.21 ; ce type par défaut couvre les versions
    # de la PED (souvent 1.18 sur Debian 10/11).
    location = /manifest.webmanifest { default_type application/manifest+json; }
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;   # mise à jour immédiate des versions
    }

    # Données pédagogiques : cache court (l'enseignant corrige ses cartes dans la journée).
    location ~* \.(json|txt|csv)$ { add_header Cache-Control "public, max-age=60" always; }
    location ~* \.(css|js|svg|png|jpg|webp|woff2?)$ { add_header Cache-Control "public, max-age=300" always; }

    # Journaux : on ne trace que le strict nécessaire, et on coupe l'accès à tout point d'admin.
    access_log /var/log/nginx/qanawa.access.log combined buffer=32k flush=5s;
    location ~ /\.(?!well-known) { deny all; }
}

server {
    # `http2 on;` séparé n'existe qu'à partir de nginx 1.25 : sur une PED en 1.18, on garde la
    # forme groupée, plus tolérante.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qanawa.local;

    ssl_certificate     /etc/ssl/certs/qanawa.local.crt;
    ssl_certificate_key /etc/ssl/private/qanawa.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/qanawa/prototype;
    index index.html;
    charset utf-8;
    location / { try_files $uri $uri/ =404; }
    location = /sw.js { add_header Cache-Control "no-store" always; }
}
